name: Public onboarding candidate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-candidate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OrbitFabric/orbitfabric-github-release-source
          ref: 372e4bdfea1116f53f616ad1b236ad0f1cfbff5d
          path: provider-source
      - uses: actions/checkout@v4
        with:
          repository: OrbitFabric/orbitfabric-fprime-adapter
          ref: 4a257ba76ede6fb8d9c40f3a52b52d4d02895f4a
          path: adapter-source
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build reviewed candidate distributions
        run: |
          python -m pip install build
          python -m build
          python -m build provider-source
          cd adapter-source
          python -m build
          python tools/build_release_bundle.py --wheel dist/*.whl
      - name: Compose exact wheel installation manifests
        run: |
          mkdir candidate-artifacts
          cp dist/*.whl provider-source/dist/*.whl candidate-artifacts/
          python tools/build_product_install.py --core-wheel dist/*.whl \
            --provider-wheel provider-source/dist/*.whl \
            --output candidate-artifacts/orbitfabric-install.txt
          python tools/build_product_install.py --core-wheel dist/*.whl \
            --provider-wheel provider-source/dist/*.whl \
            --base-url "file://$PWD/candidate-artifacts" \
            --output candidate-artifacts/candidate-install.txt
      - name: Install clean product and exercise real lifecycle without Git
        run: |
          python -m venv "$RUNNER_TEMP/product"
          PATH="$RUNNER_TEMP/product/bin" "$RUNNER_TEMP/product/bin/python" -m pip install \
            -r "$PWD/candidate-artifacts/candidate-install.txt"
          CHECK_SCRIPT="$PWD/tools/check_onboarding_candidate.py"
          ADAPTER_ROOT="$PWD/adapter-source"
          REPORT="$PWD/candidate-artifacts/e2e.json"
          cd "$RUNNER_TEMP"
          PATH="$RUNNER_TEMP/product/bin" "$RUNNER_TEMP/product/bin/python" "$CHECK_SCRIPT" \
            --wheel "$ADAPTER_ROOT/dist/orbitfabric_fprime_adapter-0.1.3-py3-none-any.whl" \
            --descriptor "$ADAPTER_ROOT/generated/release/adapter-release.json" \
            --lock "$ADAPTER_ROOT/generated/release/adapter-project-lock.json" --output "$REPORT"
      - uses: actions/upload-artifact@v4
        with:
          name: public-onboarding-candidate-${{ matrix.python }}
          path: |
            candidate-artifacts/
            adapter-source/dist/
            adapter-source/generated/release/
