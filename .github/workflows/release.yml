name: Publish product distribution

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release version and build distributions
        run: |
          python -m pip install build
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python -m build
      - name: Acquire released GitHub capability and build installation manifest
        run: |
          mkdir provider-dist
          curl --fail --location --output provider-dist/orbitfabric_github_release_source-0.1.0-py3-none-any.whl \
            https://github.com/OrbitFabric/orbitfabric-github-release-source/releases/download/v0.1.0/orbitfabric_github_release_source-0.1.0-py3-none-any.whl
          python tools/build_product_install.py \
            --core-wheel dist/orbitfabric-*-py3-none-any.whl \
            --provider-wheel provider-dist/*.whl --output dist/orbitfabric-install.txt
      - name: Verify clean wheel composition
        run: |
          python -m venv /tmp/product-smoke
          /tmp/product-smoke/bin/python -m pip install dist/*.whl provider-dist/*.whl
          /tmp/product-smoke/bin/orbitfabric adapter install --help
          /tmp/product-smoke/bin/orbitfabric-github-release-source --help
      - name: Publish exact distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *) > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS \
            --verify-tag --draft --title "OrbitFabric $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          mkdir /tmp/published-product
          gh release download "$GITHUB_REF_NAME" --dir /tmp/published-product
          python - <<'PY'
          from pathlib import Path
          for local in Path('dist').iterdir():
              assert local.read_bytes() == (Path('/tmp/published-product') / local.name).read_bytes()
          PY
          gh release edit "$GITHUB_REF_NAME" --draft=false
